name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test -race -count=1 -timeout=10m ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .tool-versions
          skip-cache: true

      - name: Validate GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: samuelmeuli/action-snapcraft@v2

      - name: Prepare Snapcraft cache
        run: mkdir -p "$HOME/.cache/snapcraft/download" "$HOME/.cache/snapcraft/stage-packages"

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - uses: actions/attest@v4
        with:
          subject-checksums: dist/lefthook_checksums.txt

      - name: Package release artifacts
        run: tar -cf dist.tar dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@12

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_KEY }}
        run: |
          bash packaging/scripts/prepare npm
          bash packaging/scripts/publish npm

  publish-npm-bundled:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@12

      - name: Publish bundled npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_KEY }}
        run: |
          bash packaging/scripts/prepare npm-bundled
          bash packaging/scripts/publish npm-bundled

  publish-npm-installer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@12

      - name: Publish npm installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_KEY }}
        run: |
          bash packaging/scripts/prepare npm-installer
          bash packaging/scripts/publish npm-installer

  publish-gem:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar

      - name: Publish RubyGem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.gem"
          printf '%s\n' '---' ":rubygems_api_key: ${RUBYGEMS_API_KEY}" > "$HOME/.gem/credentials"
          bash packaging/scripts/prepare rubygem
          bash packaging/scripts/publish rubygem

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Publish PyPI wheels
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_KEY }}
        run: |
          bash packaging/scripts/prepare pypi
          bash packaging/scripts/publish pypi

  publish-homebrew:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: dawidd6/action-homebrew-bump-formula@v10
        with:
          formula: lefthook
          token: ${{ secrets.HOMEBREW_TOKEN }}

  publish-winget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: evilmartians.lefthook
          fork-user: mrexox
          token: ${{ secrets.WINGET_TOKEN }}

  publish-distro-packages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade cloudsmith-cli

      - name: Publish distribution packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith push deb evilmartians/lefthook/any-distro/any-version dist/lefthook_*_amd64.deb
          cloudsmith push deb evilmartians/lefthook/any-distro/any-version dist/lefthook_*_arm64.deb
          cloudsmith push rpm evilmartians/lefthook/any-distro/any-version dist/lefthook_*_amd64.rpm
          cloudsmith push rpm evilmartians/lefthook/any-distro/any-version dist/lefthook_*_arm64.rpm
          cloudsmith push alpine evilmartians/lefthook/alpine/any-version dist/lefthook_*_amd64.apk
          cloudsmith push alpine evilmartians/lefthook/alpine/any-version dist/lefthook_*_arm64.apk

  publish-aur:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [aur, aur-bin]
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish AUR package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm openssh git go base-devel curl sudo

          useradd -m -G wheel runner
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          install -d -m 700 -o runner -g runner /home/runner/.ssh
          umask 077
          printf '%s\n' "$AUR_SSH_KEY" > /home/runner/.ssh/aur
          cat > /home/runner/.ssh/config <<'SSH'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSH
          ssh-keyscan -H aur.archlinux.org > /home/runner/.ssh/known_hosts
          chown -R runner:runner /home/runner/.ssh .
          su runner -c 'bash packaging/scripts/publish ${{ matrix.target }}'

  publish-php:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish PHP package
        env:
          LEFTHOOK_PHP_SSH_KEY: ${{ secrets.LEFTHOOK_PHP_SSH_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LEFTHOOK_PHP_SSH_KEY" > "$HOME/.ssh/lefthook_php"
          cat > "$HOME/.ssh/config" <<'SSH'
          Host github.com
            IdentityFile ~/.ssh/lefthook_php
            IdentitiesOnly yes
            User git
          SSH
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"
          bash packaging/scripts/publish php
